<!doctype html>
<!-- Faithful replica of the HOME screen as it looked BEFORE the redesign
     (ruled-notebook ledger-page, red margin, ring watermark, old stamp,
     saturated avatars, unhighlighted tabs, flat FAB). Data matches the demo
     ledger so it can be compared 1:1 with the current build. -->
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<base href="http://localhost:4173/">
<link rel="stylesheet" href="styles/fonts.css">
<style>
:root {
  --font-display: "Instrument Serif", Georgia, serif;
  --font-body: "DM Sans", system-ui, sans-serif;
  --font-mono: "JetBrains Mono", ui-monospace, Menlo, monospace;
  --fs-11:.6875rem; --fs-12:.75rem; --fs-13:.8125rem; --fs-14:.875rem; --fs-15:.9375rem; --fs-16:1rem; --fs-24:1.5rem;
  --s2:8px; --s3:12px; --s4:16px; --s5:20px;
  --r-xs:6px; --r-sm:10px; --r-md:14px; --r-lg:20px; --r-pill:999px;
  --e1: 0 1px 2px rgb(20 16 8 / .06), 0 1px 3px rgb(20 16 8 / .05);
  --e2: 0 2px 6px rgb(20 16 8 / .07), 0 8px 20px -8px rgb(20 16 8 / .12);
  --e3: 0 8px 24px -6px rgb(20 16 8 / .16), 0 24px 48px -20px rgb(20 16 8 / .22);
  --nav-h:62px;
}
:root, :root[data-theme="light"] {
  --paper:#F4F1E8; --surface:#FDFCF7; --surface-2:#F7F4EA; --surface-3:#EFEADC;
  --ink:#17150F; --ink-2:#4A463A; --ink-3:#7E786A; --ink-4:#A9A294;
  --line:#E2DCCC; --line-2:#D3CCB8; --rule:#DFD9C8;
  --credit:#21409B; --due:#C4372A; --due-bg:#FAE3DE; --due-ink:#96281E;
  --gold:#9A6B10; --gold-bg:#F6EACB;
  --grain:url('art/paper-light.jpg');
}
:root[data-theme="dark"] {
  --paper:#0E0D0B; --surface:#171613; --surface-2:#1E1C18; --surface-3:#262319;
  --ink:#F3EFE3; --ink-2:#C2BCAB; --ink-3:#8E887A; --ink-4:#615C50;
  --line:#2A2721; --line-2:#38342B; --rule:#262320;
  --credit:#9DB4FF; --due:#FF8A73; --due-bg:#3A1D16; --due-ink:#FFB3A0;
  --gold:#E9C46A; --gold-bg:#33290F;
  --grain:none;
  --e1:0 1px 2px rgb(0 0 0/.4);
  --e2:0 2px 8px rgb(0 0 0/.45), 0 10px 24px -10px rgb(0 0 0/.6);
}
* { box-sizing:border-box; }
body { margin:0; background:var(--paper); background-image:var(--grain); background-size:420px; color:var(--ink); font-family:var(--font-body); font-size:var(--fs-15); line-height:1.45; -webkit-font-smoothing:antialiased; }
h2,p { margin:0; }
button { font:inherit; color:inherit; background:none; border:0; padding:0; }
svg { display:block; }
.app { max-width:480px; margin:0 auto; min-height:100vh; position:relative; padding-bottom:calc(var(--nav-h) + 40px); }
header { display:flex; align-items:center; gap:10px; padding:14px 12px 10px; }
.wm { font-family:var(--font-display); font-size:var(--fs-24); letter-spacing:-.02em; }
.wm i { font-style:normal; color:var(--due); }
.tag { display:inline-flex; padding:3px 9px; border-radius:var(--r-pill); background:var(--gold-bg); color:var(--gold); font-family:var(--font-mono); font-size:var(--fs-11); font-weight:700; letter-spacing:.08em; text-transform:uppercase; }
.hicon { margin-left:auto; color:var(--ink-2); display:flex; gap:6px; }
main { padding:4px 16px 0; display:flex; flex-direction:column; gap:20px; }
/* ---- the old ruled ledger page ---- */
.ledger-page {
  position:relative;
  background: repeating-linear-gradient(to bottom, transparent 0 27px, var(--rule) 27px 28px), var(--surface);
  border:1px solid var(--line-2); border-radius:var(--r-md); box-shadow:var(--e2); overflow:hidden;
}
:root[data-theme="dark"] .ledger-page { background: repeating-linear-gradient(to bottom, transparent 0 27px, var(--rule) 27px 28px), var(--surface-2); }
.ledger-page::before { content:""; position:absolute; inset:0 auto 0 20px; width:1px; background:rgb(196 55 42 / .4); }
.netcard { position:relative; padding:var(--s4) var(--s4) var(--s3) calc(var(--s4) + 12px); overflow:hidden; }
.netcard__label { font-size:var(--fs-11); font-weight:700; letter-spacing:.12em; text-transform:uppercase; color:var(--ink-3); }
.netcard__amount { font-family:var(--font-display); font-size:clamp(2.6rem,15vw,3.4rem); line-height:.95; letter-spacing:-.035em; margin:6px 0 2px; color:var(--credit); }
.netcard__amount .cur { font-family:var(--font-body); font-size:.42em; font-weight:600; vertical-align:.55em; margin-right:3px; opacity:.6; }
.netcard__verdict { font-size:var(--fs-14); color:var(--ink-2); font-weight:550; }
.netcard__split { display:grid; grid-template-columns:1fr 1fr; gap:var(--s2); margin-top:var(--s4); padding-top:var(--s3); border-top:1px dashed var(--line-2); }
.netcard__cell b { display:block; font-family:var(--font-mono); font-size:var(--fs-16); font-weight:600; }
.netcard__cell span { font-size:var(--fs-11); color:var(--ink-3); font-weight:600; letter-spacing:.03em; text-transform:uppercase; }
.netcard__cell.r { text-align:right; }
.netcard__stamp { position:absolute; top:14px; right:10px; padding:5px 14px; border:2px solid currentColor; border-radius:var(--r-xs); font-family:var(--font-mono); font-size:var(--fs-11); font-weight:700; letter-spacing:.14em; text-transform:uppercase; opacity:.72; rotate:-7deg; color:var(--credit); }
.netcard__ring { position:absolute; right:6%; top:40%; width:92px; height:92px; border:10px solid var(--due); border-radius:50%; opacity:.06; }
.credit-text { color:var(--credit); } .due-text { color:var(--due); }
/* ---- old overdue card: solid tint slab ---- */
.overdue { width:100%; padding:var(--s3) var(--s4); display:flex; align-items:center; gap:var(--s3); text-align:left; background:var(--due-bg); border:1px solid color-mix(in srgb, var(--due) 40%, var(--line)); border-radius:var(--r-lg); box-shadow:var(--e1); }
.overdue b { font-size:var(--fs-13); color:var(--due-ink); display:block; }
.overdue span.t { font-size:var(--fs-12); color:var(--due-ink); opacity:.75; }
/* ---- rows ---- */
.sechead { display:flex; align-items:baseline; justify-content:space-between; margin-bottom:var(--s2); }
.sechead h2 { font-size:var(--fs-12); font-weight:700; letter-spacing:.09em; text-transform:uppercase; color:var(--ink-3); }
.sechead button { font-size:var(--fs-13); font-weight:600; color:var(--ink-2); display:flex; gap:6px; align-items:center; }
.list { border-radius:var(--r-lg); border:1px solid var(--line); overflow:hidden; background:var(--surface); box-shadow:var(--e1); }
.person { display:flex; align-items:center; gap:var(--s3); width:100%; text-align:left; padding:var(--s3) var(--s4); background:var(--surface); border-bottom:1px solid var(--line); }
.person:last-child { border-bottom:0; }
.avatar { width:48px; height:48px; border-radius:50%; display:grid; place-items:center; color:#fff; font-weight:700; font-size:var(--fs-14); flex:0 0 auto; }
.pmain { flex:1 1 auto; min-width:0; }
.pname { font-size:var(--fs-15); font-weight:620; display:flex; align-items:center; gap:6px; }
.pmeta { font-size:var(--fs-12); color:var(--ink-3); margin-top:1px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.pamt { text-align:right; }
.pamt b { display:block; font-family:var(--font-mono); font-size:var(--fs-15); font-weight:650; letter-spacing:-.02em; }
.pamt span { font-size:var(--fs-11); color:var(--ink-3); }
.chev { color:var(--ink-4); }
.dot { width:6px; height:6px; border-radius:50%; background:var(--due); }
.dot.c { background:var(--credit); }
/* ---- invite + fab + nav (old treatments) ---- */
.invite { padding:var(--s4); display:flex; flex-direction:column; gap:var(--s3); align-items:center; text-align:center; background:var(--surface); border:1px solid var(--line); border-radius:var(--r-lg); box-shadow:var(--e1); }
.invite p { color:var(--ink-3); font-size:var(--fs-13); }
.btn-o { display:inline-flex; align-items:center; gap:var(--s2); min-height:36px; padding:0 var(--s4); border:1px solid var(--line-2); border-radius:var(--r-pill); font-size:var(--fs-13); font-weight:600; }
.fab { position:absolute; right:16px; bottom:calc(var(--nav-h) + 14px); height:56px; padding:0 22px 0 18px; display:inline-flex; align-items:center; gap:var(--s2); background:var(--due); color:#FFF7F4; border-radius:var(--r-pill); font-weight:700; font-size:var(--fs-15); box-shadow:0 6px 18px -4px color-mix(in srgb, var(--due) 60%, transparent), var(--e3); }
.nav { position:absolute; left:0; right:0; bottom:0; display:grid; grid-template-columns:repeat(4,1fr); padding:6px 8px; background:color-mix(in srgb, var(--surface) 92%, transparent); border-top:1px solid var(--line); }
.tab { display:flex; flex-direction:column; align-items:center; gap:3px; min-height:50px; justify-content:center; color:var(--ink-4); font-size:var(--fs-11); font-weight:600; }
</style>
</head>
<body>
<div class="app">
  <header>
    <div class="wm">udhaar<i>.</i></div>
    <span class="tag">demo ledger</span>
    <span class="hicon">
      <svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M12 3v12m0-12 4 4m-4-4-4 4M4 15v4a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-4"/></svg>
      <svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="3"/><path d="M19 12a7 7 0 0 0-.1-1.2l2-1.6-2-3.4-2.4 1a7 7 0 0 0-2-1.2L14 3h-4l-.5 2.6a7 7 0 0 0-2 1.2l-2.4-1-2 3.4 2 1.6A7 7 0 0 0 5 12a7 7 0 0 0 .1 1.2l-2 1.6 2 3.4 2.4-1a7 7 0 0 0 2 1.2L10 21h4l.5-2.6a7 7 0 0 0 2-1.2l2.4 1 2-3.4-2-1.6A7 7 0 0 0 19 12Z"/></svg>
    </span>
  </header>
  <main>
    <section class="ledger-page netcard">
      <span class="netcard__ring"></span>
      <div class="netcard__stamp">CREDITOR</div>
      <div class="netcard__label">Net position</div>
      <div class="netcard__amount"><span class="cur">$</span>3,670</div>
      <p class="netcard__verdict">$3,670 of your money is currently living in other people’s pockets.</p>
      <div class="netcard__split">
        <div class="netcard__cell"><b class="credit-text">$4,890</b><span>Owed to you</span></div>
        <div class="netcard__cell r"><b class="due-text">$1,220</b><span>You owe</span></div>
      </div>
    </section>

    <button class="overdue">
      <span style="color:var(--due)"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M12 3 2 21h20L12 3Zm0 7v4m0 3v.5"/></svg></span>
      <span style="flex:1"><b>3 entries past its date</b><span class="t">Tap to review</span></span>
      <span style="color:var(--due-ink)"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m9 5 7 7-7 7"/></svg></span>
    </button>

    <section>
      <div class="sechead"><h2>The book</h2><button><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 5v14M5 12h14"/></svg> Person</button></div>
      <div class="list">
        <button class="person"><span class="avatar" style="background:linear-gradient(150deg,#2A7A4B,#1B5433)">SA</span><span class="pmain"><span class="pname">Sana <span class="dot c"></span></span><span class="pmeta">Uber home from the studio · 6d</span></span><span class="pamt"><b class="credit-text">$2,280</b><span>owes you</span></span><span class="chev"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m9 5 7 7-7 7"/></svg></span></button>
        <button class="person"><span class="avatar" style="background:linear-gradient(150deg,#7A3E9D,#53286C)">AR</span><span class="pmain"><span class="pname">Arjun <span class="dot c"></span></span><span class="pmeta">Help you shift to the new flat · 3</span></span><span class="pamt"><b class="credit-text">$1,650</b><span>owes you</span></span><span class="chev"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m9 5 7 7-7 7"/></svg></span></button>
        <button class="person"><span class="avatar" style="background:linear-gradient(150deg,#0F6E7A,#094C55)">KA</span><span class="pmain"><span class="pname">Kabir <span class="dot"></span></span><span class="pmeta">Concert ticket he grabbed first ·</span></span><span class="pamt"><b class="due-text">$900</b><span>you owe</span></span><span class="chev"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m9 5 7 7-7 7"/></svg></span></button>
        <button class="person"><span class="avatar" style="background:linear-gradient(150deg,#2B4E8C,#1B3460)">ME</span><span class="pmain"><span class="pname">Meera <span class="dot c"></span></span><span class="pmeta">She actually reads what you se</span></span><span class="pamt"><b class="credit-text">$640</b><span>owes you</span></span><span class="chev"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m9 5 7 7-7 7"/></svg></span></button>
      </div>
    </section>

    <section class="invite">
      <p>Your ledger is only as good as the people in it.</p>
      <button class="btn-o"><svg width="15" height="15" viewBox="0 0 24 24" fill="currentColor"><path d="M12 2a10 10 0 0 0-8.6 15.1L2 22l5.1-1.3A10 10 0 1 0 12 2Zm5.4 14.2c-.2.6-1.2 1.2-1.7 1.2-.4.1-1 .1-1.6-.1a13 13 0 0 1-6.5-5.7c-.5-.9-.8-1.9-.6-2.6.1-.5.7-1.4 1.2-1.5.3-.1.6 0 .8.4l.9 1.7c.1.3.1.5-.1.8l-.5.6c.6 1.2 2 2.5 3.2 3l.6-.6c.2-.2.5-.3.8-.2l1.8.8c.4.2.5.5.4.8Z"/></svg> Invite someone</button>
    </section>
  </main>

  <button class="fab"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M12 5v14M5 12h14"/></svg> Log it</button>
  <nav class="nav">
    <span class="tab"><svg width="23" height="23" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><rect x="5" y="3" width="14" height="18" rx="2"/><path d="M9 8h6M9 12h6M9 16h4"/></svg>Ledger</span>
    <span class="tab"><svg width="23" height="23" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><circle cx="9" cy="8" r="3"/><path d="M3 20a6 6 0 0 1 12 0"/><circle cx="17" cy="9" r="2.5"/><path d="M16 14.5a5 5 0 0 1 5 5"/></svg>Groups</span>
    <span class="tab"><svg width="23" height="23" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M6 9a6 6 0 1 1 12 0c0 5 2 6 2 6H4s2-1 2-6Zm4 9a2 2 0 0 0 4 0"/></svg>Alerts</span>
    <span class="tab"><svg width="23" height="23" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><circle cx="12" cy="8" r="3.5"/><path d="M5 20a7 7 0 0 1 14 0"/></svg>You</span>
  </nav>
</div>
</body>
</html>
