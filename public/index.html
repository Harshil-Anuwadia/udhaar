<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=5">
  <title>udhaar — the little things between us</title>

  <meta name="description" content="The cab, the split, the 'I'll send it later.' Keep shared money, favours and promises in one place, without searching the group chat.">
  <meta name="theme-color" content="#F7F8F5">
  <meta name="color-scheme" content="light dark">
  <script>
    try {
      const saved = JSON.parse(localStorage.getItem('udhaar.prefs.v1') || '{}').theme;
      if (saved === 'dark' || saved === 'sage') {
        document.documentElement.dataset.theme = saved;
        document.documentElement.dataset.effective = saved === 'dark' ? 'dark' : 'light';
        document.querySelector('meta[name="theme-color"]').content = saved === 'dark' ? '#111713' : '#EFF4EF';
      }
    } catch {}
  </script>
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="udhaar">
  <meta name="format-detection" content="telephone=no">

  <meta property="og:type" content="website">
  <meta property="og:site_name" content="udhaar">
  <meta property="og:title" content="udhaar — the little things between us">
  <meta property="og:description" content="For the cab, the split, and every 'I'll send it later.' A shared ledger without the group-chat maths.">
  <meta property="og:image" content="/og.png">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="udhaar — the little things between us">
  <meta name="twitter:description" content="Who paid last time? Keep the answer out of the group-chat scroll.">
  <meta name="twitter:image" content="/og.png">

  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="icon" href="/icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
  <link rel="canonical" href="/">

  <link rel="stylesheet" href="/styles/fonts.css">

  <link rel="stylesheet" href="/styles/tokens.css">
  <link rel="stylesheet" href="/styles/app.css">
  <link rel="stylesheet" href="/styles/auth-entry.css">
  <link rel="stylesheet" href="/styles/motion.css">
  <link rel="stylesheet" href="/styles/mobile-entry.css">

  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "WebApplication",
    "name": "udhaar",
    "alternateName": "Udhaar — the little things between us",
    "url": "/",
    "applicationCategory": "FinanceApplication",
    "operatingSystem": "Android, iOS",
    "offers": { "@type": "Offer", "price": "0", "priceCurrency": "INR" },
    "description": "The cab, the split, the I'll send it later. Keep shared money, favours and promises together."
  }
  </script>

  <style>
    /* A short graphite-and-sage splash before the chosen canvas appears. */
    html { background: #F7F8F5; }
    html[data-theme="dark"] { background: #111713; }
    html[data-theme="sage"] { background: #EFF4EF; }
    #boot {
      position: fixed; inset: 0; display: grid; place-items: center; z-index: 100;
      background: #0C0D0C; color: #70AD89;
      font-family: "DM Sans", system-ui, sans-serif;
    }
    #boot .w { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 18px; font-size: clamp(2rem, 10vw, 2.75rem); font-weight: 750; letter-spacing: -0.07em; line-height: 1; animation: bootIn 620ms cubic-bezier(.16,1,.3,1) both; }
    #boot .w img { width: 80px; height: 80px; flex: 0 0 auto; }
    #boot .w i { font-style: normal; color: #FFFFFF; }
    #boot p { margin-top: 14px; font-size: 11px; font-weight: 650; letter-spacing: .18em; text-transform: uppercase; color: #FFFFFF; opacity: .58; }
    @keyframes bootIn { from { opacity: 0; transform: translateY(10px) scale(.97); } }
    @media (prefers-reduced-motion: reduce) { #boot .w { animation: none; } }
    .bare-outlet { padding: 0 !important; }
  </style>
</head>
<body>
  <a class="skip-link" href="#main">Skip to your ledger</a>

  <div id="boot"><div style="text-align:center"><div class="w"><img src="/icons/icon.svg" alt="" width="80" height="80"><span>udhaar<i>.</i></span></div><p>the little things between us</p></div></div>

  <div id="app" aria-label="Udhaar"></div>

  <main class="desktop-gate" aria-labelledby="desktop-title">
    <div class="desktop-gate__brand"><img src="/icons/icon.svg" alt="" width="42" height="42"><span>udhaar.</span></div>
    <div class="desktop-gate__body">
      <p class="desktop-gate__eyebrow">Made for your phone</p>
      <h1 id="desktop-title">Sorry, udhaar isn’t available on desktop right now.</h1>
      <p>Open this page on your phone to continue. Your people and your shared stories will be right there.</p>
    </div>
    <div class="desktop-gate__foot"><span>The little things between us.</span><span class="desktop-gate__address"></span></div>
  </main>

  <script type="module" src="/js/entry.js"></script>
</body>
</html>
